<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Inversor</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; width: 100%; }
        h2 { color: #2c3e50; text-align: center; }
        .campo { margin-bottom: 15px; }
        input[type="text"], input[type="tel"] { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .pregunta { font-weight: bold; margin-top: 20px; display: block; }
        label { display: block; padding: 10px; margin: 5px 0; border: 1px solid #eee; border-radius: 5px; cursor: pointer; }
        label:hover { background: #f9f9f9; }
        button { background: #007bff; color: white; border: none; padding: 15px; border-radius: 5px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Test del Inversor</h2>
        <form action="https://formspree.io/f/mdabwzgr" method="POST">
            
            <!-- DATOS BÁSICOS -->
            <div class="campo">
                <input type="text" name="Nombre" placeholder="Nombre completo" required>
            </div>
            <div class="campo">
                <input type="tel" name="Telefono" placeholder="Teléfono / WhatsApp" required>
            </div>

            <!-- PREGUNTAS -->
            <span class="pregunta">1. ¿Cuál es tu experiencia en inversiones?</span>
            <label><input type="radio" name="Exp" value="Nula" required> Nula</label>
            <label><input type="radio" name="Exp" value="Media"> Media</label>
            <label><input type="radio" name="Exp" value="Alta"> Alta</label>

            <span class="pregunta">2. ¿Por cuánto tiempo podés invertir?</span>
            <label><input type="radio" name="Plazo" value="Corto" required> Menos de 1 año</label>
            <label><input type="radio" name="Plazo" value="Medio"> 1 a 3 años</label>
            <label><input type="radio" name="Plazo" value="Largo"> Más de 3 años</label>

            <span class="pregunta">3. Si tu inversión baja un 10%, ¿qué hacés?</span>
            <label><input type="radio" name="Riesgo" value="Vender" required> Vendo por miedo</label>
            <label><input type="radio" name="Riesgo" value="Mantener"> Mantengo y espero</label>
            <label><input type="radio" name="Riesgo" value="Comprar"> Compro más</label>

            <span class="pregunta">4. ¿Cuál es tu objetivo?</span>
            <label><input type="radio" name="Meta" value="Ahorro" required> Proteger mis ahorros</label>
            <label><input type="radio" name="Meta" value="Ganancia"> Ganar lo máximo posible</label>

            <button type="submit">Enviar Test</button>
        </form>
    </div>
</body>
</html>
