<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Inversor</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; width: 100%; }
        h2 { color: #1a73e8; text-align: center; }
        .step { margin-bottom: 20px; }
        input[type="text"], input[type="tel"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        label { display: block; margin: 10px 0; padding: 10px; border: 1px solid #eee; border-radius: 6px; cursor: pointer; }
        button { background: #1a73e8; color: white; border: none; padding: 15px; border-radius: 6px; width: 100%; cursor: pointer; font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Descubrí tu Perfil de Inversor</h2>
        <!-- CAMBIA EL ID DE ABAJO POR EL QUE TE DA FORMSPREE -->
        <form action="https://formspree.io/f/mdabwzgr" method="POST">
            
            <div class="step">
                <p><strong>Tus datos de contacto:</strong></p>
                <input type="text" name="nombre" placeholder="Tu Nombre completo" required>
                <input type="tel" name="whatsapp" placeholder="Tu WhatsApp (ej: +54911...)" required>
            </div>

            <div class="step">
                <p><strong>1. ¿Cuál es tu prioridad?</strong></p>
                <label><input type="radio" name="objetivo" value="Conservador" required> No perder dinero</label>
                <label><input type="radio" name="objetivo" value="Agresivo"> Ganar lo máximo posible</label>
            </div>

            <div class="step">
                <p><strong>2. ¿Por cuánto tiempo invertirías?</strong></p>
                <label><input type="radio" name="plazo" value="Corto" required> Menos de 1 año</label>
                <label><input type="radio" name="plazo" value="Largo"> Más de 3 años</label>
            </div>

            <button type="submit">Enviar y ver resultados</button>
        </form>
    </div>
</body>
</html>
